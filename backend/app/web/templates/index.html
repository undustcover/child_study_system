<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
        background: #fff8f3;
        color: #241915;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff8f3;
      }

      button {
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 6px;
        padding: 0 13px;
        font: 700 14px/1 "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
        white-space: nowrap;
        cursor: default;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 168px minmax(0, 1fr);
      }

      .sidebar {
        background: #fff0e7;
        border-right: 1px solid #edd7c9;
        padding: 22px 14px;
      }

      .brand {
        margin-bottom: 26px;
        color: #2e221c;
      }

      .brand strong {
        display: block;
        font-size: 18px;
        line-height: 1.35;
      }

      .brand span {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: #7b6254;
      }

      .nav {
        display: grid;
        gap: 8px;
      }

      .nav a {
        height: 38px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        border-radius: 6px;
        color: #725442;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      .nav a.active {
        background: #e85d3f;
        color: #ffffff;
      }

      .main {
        min-width: 0;
        padding: 28px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        margin-bottom: 20px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 26px;
        line-height: 1.3;
      }

      .subtitle {
        margin-top: 6px;
        color: #755e52;
        font-size: 14px;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .secondary {
        background: #e8f1ed;
        color: #255345;
      }

      .primary {
        background: #d94f36;
        color: #ffffff;
      }

      .dashboard {
        display: grid;
        grid-template-columns: minmax(420px, 1.45fr) minmax(320px, 0.95fr);
        gap: 16px;
      }

      .panel {
        border: 1px solid #ead8cc;
        border-radius: 8px;
        background: #ffffff;
        padding: 16px;
      }

      .panel h2 {
        margin-bottom: 14px;
        font-size: 17px;
        line-height: 1.35;
      }

      .task-list {
        display: grid;
      }

      .empty {
        border-radius: 7px;
        background: #fff8f3;
        color: #765f53;
        padding: 14px;
        font-size: 14px;
        line-height: 1.6;
      }

      .task {
        display: grid;
        grid-template-columns: 68px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        min-height: 68px;
        border-top: 1px solid #f0e2d8;
      }

      .task:first-child {
        border-top: 0;
      }

      .time {
        color: #241915;
        font-size: 15px;
        font-weight: 800;
      }

      .task strong,
      .status-block strong,
      .event strong,
      .device-cell strong {
        display: block;
        color: #1f1714;
        font-size: 15px;
        line-height: 1.45;
      }

      .task span,
      .status-block span,
      .event span,
      .device-cell span {
        display: block;
        margin-top: 4px;
        color: #765f53;
        font-size: 13px;
        line-height: 1.5;
      }

      .tag {
        border-radius: 999px;
        padding: 6px 10px;
        background: #eef3ef;
        color: #2d5c4d;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .tag.active {
        background: #d94f36;
        color: #ffffff;
      }

      .current {
        min-height: 194px;
      }

      .current-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: end;
        margin-bottom: 16px;
      }

      .current-head strong {
        display: block;
        font-size: 28px;
        line-height: 1.25;
      }

      .current-head span {
        display: block;
        margin-top: 6px;
        color: #765f53;
        font-size: 13px;
      }

      .timer {
        color: #211713;
        font-size: 30px;
        font-weight: 900;
        white-space: nowrap;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .stat {
        min-height: 72px;
        border-radius: 7px;
        background: #f8eadf;
        padding: 12px;
      }

      .stat b {
        display: block;
        font-size: 24px;
        line-height: 1.2;
      }

      .stat span {
        display: block;
        margin-top: 4px;
        color: #765f53;
        font-size: 13px;
      }

      .wide {
        grid-column: 1 / -1;
      }

      .events {
        display: grid;
        gap: 10px;
      }

      .event {
        border-radius: 7px;
        background: #f8eadf;
        padding: 12px;
      }

      .device-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .device-cell {
        min-height: 78px;
        border-radius: 7px;
        background: #eef3ef;
        padding: 12px;
      }

      .footer-note {
        margin-top: 18px;
        color: #856a5c;
        font-size: 13px;
        line-height: 1.6;
      }

      @media (max-width: 980px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid #edd7c9;
        }

        .nav {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .nav a {
          justify-content: center;
        }

        .dashboard {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .main {
          padding: 20px 14px;
        }

        .topbar,
        .current-head {
          display: block;
        }

        .actions {
          justify-content: flex-start;
          margin-top: 14px;
        }

        .nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .task,
        .stats,
        .device-grid {
          grid-template-columns: 1fr;
        }

        .tag {
          width: max-content;
        }

        .timer {
          margin-top: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <strong>小朋友<br>学习安排</strong>
          <span>{{ app_version }} · 本机免登录</span>
        </div>
        <nav class="nav" aria-label="主导航">
          <a class="active" href="#">今日</a>
          <a href="/plans">计划</a>
          <a href="#">设备</a>
          <a href="#">统计</a>
          <a href="#">纠错</a>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1>今日陪伴看板</h1>
            <p class="subtitle" id="today-subtitle">正在加载今日数据...</p>
          </div>
          <div class="actions">
            <button class="secondary" type="button">查看日历</button>
            <button class="primary" type="button">新建任务</button>
          </div>
        </header>

        <section class="dashboard">
          <section class="panel">
            <h2>今天要做的事</h2>
            <div class="task-list" id="task-list">
              <div class="empty">正在读取今日任务...</div>
            </div>
          </section>

          <section class="panel current">
            <h2>正在进行</h2>
            <div class="current-head">
              <div>
                <strong id="current-title">正在加载</strong>
                <span id="current-description">正在读取当前任务状态...</span>
              </div>
              <div class="timer" id="current-timer">00:00</div>
            </div>
            <div class="stats">
              <div class="stat">
                <b id="device-status">离线</b>
                <span>设备状态</span>
              </div>
              <div class="stat">
                <b id="reminder-count">0次</b>
                <span>今日播报</span>
              </div>
              <div class="stat">
                <b id="parent-confirm-count">0项</b>
                <span>需处理</span>
              </div>
            </div>
          </section>

          <section class="panel wide">
            <h2>最近动态</h2>
            <div class="events" id="reminder-list">
              <div class="empty">正在读取最近播报...</div>
            </div>
          </section>

          <section class="panel wide">
            <h2>设备与处理状态</h2>
            <div class="device-grid" id="device-grid">
              <div class="device-cell">
                <strong>设备状态</strong>
                <span>正在读取设备信息...</span>
              </div>
            </div>
          </section>
        </section>

        <p class="footer-note" id="footer-note">首页数据来自 <code>/api/dashboard/today</code>；后续继续接入计划编辑和纠错操作。</p>
      </main>
    </div>
    <script>
      const activeStatuses = new Set(["studying", "reminding", "waiting_finish_confirm", "paused"]);

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatReminderTime(value) {
        if (!value) {
          return "";
        }
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      }

      function taskDetail(task) {
        const subject = task.subject ? `${task.subject} · ` : "";
        const content = task.content ? `${task.content} · ` : "";
        return `${subject}${content}计划 ${task.planned_minutes} 分钟`;
      }

      function renderTasks(tasks) {
        const container = document.querySelector("#task-list");
        if (!tasks.length) {
          container.innerHTML = '<div class="empty">今天还没有生成任务。可以先到计划页面创建日历计划，再生成今日任务。</div>';
          return;
        }
        container.innerHTML = tasks
          .map((task) => {
            const active = activeStatuses.has(task.status) ? " active" : "";
            return `
              <div class="task">
                <div class="time">${escapeHtml(task.start_time)}</div>
                <div>
                  <strong>${escapeHtml(task.title)}</strong>
                  <span>${escapeHtml(taskDetail(task))}</span>
                </div>
                <span class="tag${active}">${escapeHtml(task.status_label)}</span>
              </div>
            `;
          })
          .join("");
      }

      function renderCurrent(current) {
        const title = document.querySelector("#current-title");
        const description = document.querySelector("#current-description");
        const timer = document.querySelector("#current-timer");
        title.textContent = current.task ? current.task.title : "暂无当前任务";
        description.textContent = current.description;
        timer.textContent = current.elapsed_label || "00:00";
      }

      function renderStats(stats) {
        document.querySelector("#device-status").textContent = stats.device_status_label;
        document.querySelector("#reminder-count").textContent = `${stats.reminder_count}次`;
        document.querySelector("#parent-confirm-count").textContent = `${stats.pending_parent_confirm}项`;
      }

      function renderReminders(reminders) {
        const container = document.querySelector("#reminder-list");
        if (!reminders.length) {
          container.innerHTML = '<div class="empty">今天还没有播报记录。</div>';
          return;
        }
        container.innerHTML = reminders
          .map((reminder) => `
            <div class="event">
              <strong>${escapeHtml(formatReminderTime(reminder.scheduled_at))} ${escapeHtml(reminder.status_label)}${escapeHtml(reminder.event_type_label)}</strong>
              <span>${escapeHtml(reminder.message_text)}</span>
            </div>
          `)
          .join("");
      }

      function renderDevices(devices, stats) {
        const container = document.querySelector("#device-grid");
        if (!devices.length) {
          container.innerHTML = `
            <div class="device-cell">
              <strong>设备离线</strong>
              <span>还没有设备连接记录。</span>
            </div>
            <div class="device-cell">
              <strong>计划同步</strong>
              <span>暂无同步记录。</span>
            </div>
            <div class="device-cell">
              <strong>待家长确认</strong>
              <span>${stats.pending_parent_confirm ? `有 ${stats.pending_parent_confirm} 项需要处理。` : "暂无需要处理的事项。"}</span>
            </div>
          `;
          return;
        }
        const device = devices[0];
        container.innerHTML = `
          <div class="device-cell">
            <strong>设备${escapeHtml(device.status_label)}</strong>
            <span>${escapeHtml(device.device_id)} · ${escapeHtml(device.hardware_model)}</span>
          </div>
          <div class="device-cell">
            <strong>计划同步</strong>
            <span>${escapeHtml(device.sync_label)}</span>
          </div>
          <div class="device-cell">
            <strong>待家长确认</strong>
            <span>${stats.pending_parent_confirm ? `有 ${stats.pending_parent_confirm} 项需要处理。` : "暂无需要处理的事项。"}</span>
          </div>
        `;
      }

      async function loadDashboard() {
        try {
          const response = await fetch("/api/dashboard/today");
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const data = await response.json();
          document.querySelector("#today-subtitle").textContent =
            `${data.date_label} · ${data.student_name} · 中文界面 · 学生通过 BOX-3 语音执行任务`;
          renderTasks(data.tasks);
          renderCurrent(data.current);
          renderStats(data.stats);
          renderReminders(data.reminders);
          renderDevices(data.devices, data.stats);
        } catch (error) {
          document.querySelector("#today-subtitle").textContent = "今日数据加载失败，请确认后端服务正在运行。";
          document.querySelector("#task-list").innerHTML = '<div class="empty">暂时无法读取今日任务。</div>';
          document.querySelector("#reminder-list").innerHTML = '<div class="empty">暂时无法读取播报记录。</div>';
          document.querySelector("#footer-note").textContent = `数据加载失败：${error.message}`;
        }
      }

      loadDashboard();
    </script>
  </body>
</html>
